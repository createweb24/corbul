# Blueprint Render — API-ul NestJS pentru Corbul.md
#
# Împărțirea rolurilor:
#   • Vercel  → aplicația web (Next.js), vezi vercel.json
#   • Render  → acest serviciu, API-ul NestJS (are nevoie de proces pornit)
#   • Neon    → baza PostgreSQL (plan gratuit permanent), schema `corbul`
#
# Folosire: render.com → New → Blueprint → alege depozitul.
# Render creează serviciul, îi cere cele două adrese de bază de date, apoi
# rulează migrările și încarcă cele 24 de articole. Seed-ul este idempotent,
# deci se poate relua la fiecare deploy fără să dubleze nimic.
#
# După prima pornire, ia adresa serviciului (https://<nume>.onrender.com) și
# pune-o în Vercel ca API_URL și NEXT_PUBLIC_API_URL, cu sufixul /api.

services:
  - type: web
    name: corbul-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # instalarea pornește din rădăcina monorepo-ului (npm workspaces),
    # apoi se generează clientul Prisma, se compilează și se populează baza
    # „--include=dev" e obligatoriu: NODE_ENV=production (mai jos) face ca
    # `npm install` să sară peste devDependencies, iar build-ul are nevoie de
    # prisma, ts-node și @nestjs/cli, care stau exact acolo.
    buildCommand: npm install --include=dev && npm run build --workspace=api && npm run db:seed
    startCommand: npm run start --workspace=api
    healthCheckPath: /api/health
    envVars:
      # Neon → connection string FĂRĂ „-pooler" în gazdă, cu „&schema=corbul" la
      # coadă. Schema separată ține Corbul departe de celelalte site-uri din
      # același proiect Neon, iar pooler-ul refuză parametrul `search_path`,
      # deci schema separată cere conexiune directă. Un proces care stă pornit
      # oricum nu are nevoie de pooler.
      #   postgresql://USER:PAROLA@ep-….aws.neon.tech/neondb?sslmode=require&schema=corbul
      - key: DATABASE_URL
        sync: false
      # aceeași valoare: migrările cer o sesiune adevărată
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # adresa aplicației de pe Vercel — CORS și redirecturile Stripe
      - key: WEB_URL
        sync: false
      # lasă-le goale: plățile rămân în mod demonstrativ, restul site-ului merge
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
